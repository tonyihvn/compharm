<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComPharm - Pharmacy Management</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; background: #f0f2f5; overflow: hidden; }
        
        .container { display: flex; height: 100vh; }
        .sidebar { width: 250px; background: #2c3e50; color: white; padding: 20px; overflow-y: auto; box-shadow: 2px 0 10px rgba(0,0,0,0.1); }
        .logo { font-size: 24px; font-weight: bold; margin-bottom: 30px; color: #3498db; }
        .nav-item { padding: 12px; margin: 8px 0; border-radius: 6px; cursor: pointer; transition: all 0.3s; }
        .nav-item:hover { background: #34495e; transform: translateX(5px); }
        .nav-item.active { background: #3498db; }
        
        .main-content { flex: 1; overflow-y: auto; padding: 30px; }
        
        .login-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .login-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); width: 100%; max-width: 400px; }
        .login-box h1 { color: #2c3e50; margin-bottom: 30px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #2c3e50; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .form-group input:focus { outline: none; border-color: #3498db; box-shadow: 0 0 5px rgba(52, 152, 219, 0.3); }
        .btn { padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.3s; }
        .btn-primary { background: #3498db; color: white; }
        .btn-primary:hover { background: #2980b9; transform: translateY(-2px); }
        .btn-success { background: #27ae60; color: white; }
        .btn-success:hover { background: #229954; }
        .btn-secondary { background: #95a5a6; color: white; }
        .btn-secondary:hover { background: #7f8c8d; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-danger:hover { background: #c0392b; }
        .btn-warning { background: #f39c12; color: white; }
        .btn-warning:hover { background: #d68910; }
        
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .stat-card h3 { color: #7f8c8d; font-size: 12px; text-transform: uppercase; margin-bottom: 10px; }
        .stat-card .value { font-size: 28px; font-weight: bold; color: #2c3e50; }
        .stat-card .change { font-size: 12px; color: #27ae60; margin-top: 10px; }
        
        .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ecf0f1; }
        .tab-btn { padding: 12px 20px; background: none; border: none; cursor: pointer; font-size: 14px; font-weight: 600; color: #7f8c8d; border-bottom: 3px solid transparent; transition: all 0.3s; }
        .tab-btn.active { color: #3498db; border-bottom-color: #3498db; }
        .tab-btn:hover { color: #2c3e50; }
        
        .content-section { display: none; }
        .content-section.active { display: block; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; border-radius: 8px; width: 90%; max-width: 600px; max-height: 90vh; overflow: auto; }
        .modal-header { padding: 20px; border-bottom: 1px solid #ecf0f1; display: flex; justify-content: space-between; align-items: center; }
        .modal-header h2 { font-size: 20px; color: #2c3e50; }
        .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: #7f8c8d; }
        .modal-body { padding: 20px; }
        .modal-footer { padding: 20px; border-top: 1px solid #ecf0f1; text-align: right; display: flex; gap: 10px; justify-content: flex-end; }
        
        .alert { padding: 15px 20px; border-radius: 6px; margin-bottom: 20px; font-weight: 600; }
        .alert-success { background: #d5f4e6; color: #27ae60; }
        .alert-error { background: #fadbd8; color: #c0392b; }
        .alert-info { background: #d6eaf8; color: #2980b9; }
        
        .table-container { overflow-x: auto; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; }
        thead tr { background: #667eea; color: white; }
        th { padding: 15px; text-align: left; font-weight: 600; }
        td { padding: 15px; border-bottom: 1px solid #ecf0f1; }
        tr:hover { background: #f8f9fa; }
        
        .action-buttons { display: flex; gap: 8px; }
        .action-buttons button { padding: 6px 12px; font-size: 12px; border: none; border-radius: 4px; cursor: pointer; color: white; transition: all 0.2s; }
        .btn-view { background: #3498db; }
        .btn-view:hover { background: #2980b9; }
        .btn-edit { background: #f39c12; }
        .btn-edit:hover { background: #d68910; }
        .btn-delete { background: #e74c3c; }
        .btn-delete:hover { background: #c0392b; }
        
        .form-group select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .hidden { display: none; }
        
        .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 768px) { .grid-form { grid-template-columns: 1fr; } }
        
        .logout-btn { margin-top: auto; width: 100%; padding: 12px; background: #e74c3c; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .logout-btn:hover { background: #c0392b; }
    </style>
</head>
<body>

<div id="loginPage" class="login-page">
    <div class="login-box">
        <h1>ComPharm</h1>
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
        </form>
    </div>
</div>

<div id="mainApp" class="container" style="display: none;">
    <div class="sidebar">
        <div class="logo">ComPharm</div>
        <div class="nav-item active" onclick="showTab('dashboard')">Dashboard</div>
        <div class="nav-item" onclick="showTab('clients')">Clients</div>
        <div class="nav-item" onclick="showTab('users')">Users</div>
        <div class="nav-item" onclick="showTab('fields')">Fields</div>
        <button class="logout-btn" onclick="handleLogout()">Logout</button>
    </div>
    
    <div class="main-content">
        <div id="dashboardAlert"></div>
        <div id="contentAlert"></div>
        
        <div id="dashboard" class="content-section active">
            <h1>Dashboard</h1>
            <div class="dashboard">
                <div class="stat-card">
                    <h3>Total Clients</h3>
                    <div class="value" id="totalClients">0</div>
                </div>
                <div class="stat-card">
                    <h3>Total Users</h3>
                    <div class="value" id="totalUsers">0</div>
                </div>
                <div class="stat-card">
                    <h3>Pharmacies</h3>
                    <div class="value" id="totalPharmacies">0</div>
                </div>
            </div>
        </div>
        
        <div id="clients" class="content-section">
            <h1>Clients Management</h1>
            <button class="btn btn-primary" onclick="openAddClientModal()" style="margin-bottom: 20px;">Add Client</button>
            <div class="table-container">
                <div id="clientsList"></div>
            </div>
        </div>
        
        <div id="users" class="content-section">
            <h1>User Management</h1>
            <button class="btn btn-primary" onclick="openAddUserModal()" style="margin-bottom: 20px;">Add User</button>
            <div class="table-container">
                <div id="usersList"></div>
            </div>
        </div>
        
        <div id="fields" class="content-section">
            <h1>Field Management</h1>
            <button class="btn btn-primary" onclick="openAddFieldModal()" style="margin-bottom: 20px;">Add Field</button>
            <div id="fieldsList"></div>
        </div>
    </div>
</div>

<script>
const API_URL = 'http://localhost:3001/api';

function showTab(tab) {
    document.querySelectorAll('.content-section').forEach(el => el.classList.remove('active'));
    document.getElementById(tab).classList.add('active');
    
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    event.target.classList.add('active');
    
    if (tab === 'clients') loadClients();
    if (tab === 'users') loadUsers();
    if (tab === 'fields') loadFieldManager();
    if (tab === 'dashboard') loadDashboard();
}

async function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    
    try {
        console.log('Attempting login with email:', email);
        console.log('API URL:', API_URL);
        
        const res = await fetch(`${API_URL}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ email, password })
        });
        
        console.log('Response status:', res.status);
        const data = await res.json();
        console.log('Response data:', data);
        
        if (res.ok && data.token) {
            localStorage.setItem('token', data.token);
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('mainApp').style.display = 'flex';
            loadDashboard();
        } else {
            alert('Login failed: ' + (data.message || 'Unknown error'));
        }
    } catch (e) {
        console.error('Login error:', e);
        alert('Error: ' + e.message + '\nServer URL: ' + API_URL);
    }
}

function handleLogout() {
    localStorage.removeItem('token');
    document.getElementById('loginPage').style.display = 'flex';
    document.getElementById('mainApp').style.display = 'none';
}

async function loadDashboard() {
    try {
        const clientsRes = await fetch(`${API_URL}/clients`, {
            headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
        });
        const clientsData = await clientsRes.json();
        document.getElementById('totalClients').textContent = (clientsData.clients || []).length;
    } catch (e) {
        console.log('Dashboard error:', e);
    }
}

async function loadClients() {
    try {
        const res = await fetch(`${API_URL}/clients`, {
            headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
        });
        const data = await res.json();
        const clients = data.clients || [];

        if (!clients.length) {
            document.getElementById('clientsList').innerHTML = '<p style="padding: 20px; text-align: center; color: #666;">No clients found</p>';
            return;
        }

        const allKeys = new Set();
        clients.forEach(c => Object.keys(c).forEach(k => allKeys.add(k)));
        
        const preferredOrder = ['name', 'pepfarId', 'pharmacyCode', 'facilityCode', 'phone', 'email'];
        const sortedKeys = [];
        preferredOrder.forEach(k => {
            if (allKeys.has(k)) {
                sortedKeys.push(k);
                allKeys.delete(k);
            }
        });
        sortedKeys.push(...Array.from(allKeys).sort());

        let html = '<div style="overflow-x: auto;"><table style="width: 100%; border-collapse: collapse;">';
        html += '<thead><tr style="background: #667eea; color: white;">';
        sortedKeys.forEach(key => {
            const headerName = key.charAt(0).toUpperCase() + key.slice(1)
                .replace(/([A-Z])/g, ' $1')
                .replace('Pepfar', 'PEPFAR');
            html += `<th style="padding: 12px; text-align: left; font-weight: 600;">${headerName}</th>`;
        });
        html += '<th style="padding: 12px; text-align: center; font-weight: 600;">Actions</th></tr></thead>';

        html += '<tbody>';
        clients.forEach((client, idx) => {
            const bgColor = idx % 2 === 0 ? '#ffffff' : '#f8f9fa';
            html += `<tr style="background: ${bgColor}; border-bottom: 1px solid #e0e0e0;">`;
            
            sortedKeys.forEach(key => {
                const value = client[key] || '-';
                html += `<td style="padding: 12px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${value}</td>`;
            });
            
            html += `<td style="padding: 12px; text-align: center;">
                <button class="btn-view" onclick="viewClient('${client.id}')">View</button>
                <button class="btn-edit" onclick="editClient('${client.id}')">Edit</button>
                <button class="btn-delete" onclick="deleteClient('${client.id}')">Delete</button>
            </td></tr>`;
        });
        html += '</tbody></table></div>';
        
        document.getElementById('clientsList').innerHTML = html;
    } catch (e) {
        document.getElementById('clientsList').innerHTML = '<p style="padding: 20px; color: red;">Error: ' + e.message + '</p>';
    }
}

async function viewClient(clientId) {
    try {
        const res = await fetch(`${API_URL}/clients/${clientId}`, {
            headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
        });
        const data = await res.json();
        const client = data.client || data;

        let html = '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">';
        Object.entries(client).forEach(([key, value]) => {
            if (key !== 'id') {
                const label = key.charAt(0).toUpperCase() + key.slice(1).replace(/([A-Z])/g, ' $1');
                html += `<div><strong>${label}:</strong> ${value || '-'}</div>`;
            }
        });
        html += '</div>';
        showDetailModal('Client Details', html, clientId, true);
    } catch (e) {
        showAlert('contentAlert', 'Error: ' + e.message, 'error');
    }
}

async function editClient(clientId) {
    try {
        const res = await fetch(`${API_URL}/clients/${clientId}`, {
            headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
        });
        const data = await res.json();
        const client = data.client || data;

        let html = '<form id="editClientForm">';
        Object.entries(client).forEach(([key, value]) => {
            if (key !== 'id') {
                const label = key.charAt(0).toUpperCase() + key.slice(1).replace(/([A-Z])/g, ' $1');
                html += `<div class="form-group">
                    <label>${label}</label>
                    <input type="text" id="edit_${key}" value="${value || ''}" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                </div>`;
            }
        });
        html += '</form>';
        showDetailModal('Edit Client', html, clientId, false);
    } catch (e) {
        showAlert('contentAlert', 'Error: ' + e.message, 'error');
    }
}

async function handleEditClientSave(clientId) {
    try {
        const form = document.getElementById('editClientForm');
        const updateData = {};
        Array.from(form.elements).forEach(elem => {
            if (elem.id && elem.id.startsWith('edit_')) {
                updateData[elem.id.substring(5)] = elem.value;
            }
        });

        const res = await fetch(`${API_URL}/clients/${clientId}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + localStorage.getItem('token')
            },
            body: JSON.stringify(updateData)
        });

        if (res.ok) {
            closeDetailModal();
            showAlert('contentAlert', 'Client updated!', 'success');
            loadClients();
        }
    } catch (e) {
        showAlert('contentAlert', 'Error: ' + e.message, 'error');
    }
}

async function deleteClient(clientId) {
    if (!confirm('Delete this client?')) return;
    try {
        const res = await fetch(`${API_URL}/clients/${clientId}`, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
        });
        if (res.ok) {
            showAlert('contentAlert', 'Client deleted!', 'success');
            loadClients();
        }
    } catch (e) {
        showAlert('contentAlert', 'Error: ' + e.message, 'error');
    }
}

function showDetailModal(title, content, clientId, isViewOnly) {
    let modal = document.getElementById('detailModal');
    if (!modal) {
        modal = document.createElement('div');
        modal.id = 'detailModal';
        modal.className = 'modal';
        document.body.appendChild(modal);
    }
    
    let buttons = `<button class="btn btn-secondary" onclick="closeDetailModal()">Close</button>`;
    if (!isViewOnly) {
        buttons = `<button class="btn btn-success" onclick="handleEditClientSave('${clientId}')">Save</button>` + buttons;
    }
    
    modal.innerHTML = `
        <div class="modal-content">
            <div class="modal-header"><h2>${title}</h2><button class="modal-close" onclick="closeDetailModal()">×</button></div>
            <div class="modal-body">${content}</div>
            <div class="modal-footer">${buttons}</div>
        </div>
    `;
    modal.classList.add('active');
}

function closeDetailModal() {
    const modal = document.getElementById('detailModal');
    if (modal) modal.classList.remove('active');
}

async function openAddClientModal() {
    let html = '<form id="addClientForm" class="grid-form">';
    html += '<div class="form-group"><label>Name</label><input type="text" id="clientName" required></div>';
    html += '<div class="form-group"><label>PEPFAR ID</label><input type="text" id="clientPepfarId"></div>';
    html += '<div class="form-group"><label>Pharmacy Code</label><input type="text" id="clientPharmacyCode"></div>';
    html += '<div class="form-group"><label>Facility Code</label><input type="text" id="clientFacilityCode"></div>';
    html += '</form>';
    
    let modal = document.getElementById('addClientModal');
    if (!modal) {
        modal = document.createElement('div');
        modal.id = 'addClientModal';
        modal.className = 'modal';
        document.body.appendChild(modal);
    }
    
    modal.innerHTML = `
        <div class="modal-content">
            <div class="modal-header"><h2>Add Client</h2></div>
            <div class="modal-body">${html}</div>
            <div class="modal-footer">
                <button class="btn btn-success" onclick="handleAddClient()">Add</button>
                <button class="btn btn-secondary" onclick="document.getElementById('addClientModal').classList.remove('active')">Cancel</button>
            </div>
        </div>
    `;
    modal.classList.add('active');
}

async function handleAddClient() {
    const data = {
        name: document.getElementById('clientName').value,
        pepfarId: document.getElementById('clientPepfarId').value,
        pharmacyCode: document.getElementById('clientPharmacyCode').value,
        facilityCode: document.getElementById('clientFacilityCode').value
    };
    
    try {
        const res = await fetch(`${API_URL}/clients`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + localStorage.getItem('token')
            },
            body: JSON.stringify(data)
        });
        
        if (res.ok) {
            document.getElementById('addClientModal').classList.remove('active');
            showAlert('contentAlert', 'Client added!', 'success');
            loadClients();
        }
    } catch (e) {
        showAlert('contentAlert', 'Error: ' + e.message, 'error');
    }
}

async function openAddUserModal() {
    let html = '<form id="addUserForm">';
    html += '<div class="form-group"><label>Email</label><input type="email" id="userEmail" required></div>';
    html += '<div class="form-group"><label>Full Name</label><input type="text" id="userFullName" required></div>';
    html += '<div class="form-group"><label>Role</label><select id="userRole" onchange="updateRoleDependentFields()">';
    html += '<option value="admin">Admin</option><option value="pharmacy_staff">Pharmacy Staff</option><option value="facility_manager">Facility Manager</option></select></div>';
    html += '<div class="form-group hidden" id="pharmacyIdGroup"><label>Pharmacy ID</label><input type="text" id="userPharmacyId"></div>';
    html += '<div class="form-group hidden" id="facilityIdGroup"><label>Facility ID</label><input type="text" id="userFacilityId"></div>';
    html += '</form>';
    
    let modal = document.getElementById('addUserModal');
    if (!modal) {
        modal = document.createElement('div');
        modal.id = 'addUserModal';
        modal.className = 'modal';
        document.body.appendChild(modal);
    }
    
    modal.innerHTML = `
        <div class="modal-content">
            <div class="modal-header"><h2>Add User</h2></div>
            <div class="modal-body">${html}</div>
            <div class="modal-footer">
                <button class="btn btn-success" onclick="handleAddUser()">Add</button>
                <button class="btn btn-secondary" onclick="document.getElementById('addUserModal').classList.remove('active')">Cancel</button>
            </div>
        </div>
    `;
    modal.classList.add('active');
}

function updateRoleDependentFields() {
    const role = document.getElementById('userRole').value;
    document.getElementById('pharmacyIdGroup').style.display = role === 'pharmacy_staff' ? 'block' : 'none';
    document.getElementById('facilityIdGroup').style.display = role === 'facility_manager' ? 'block' : 'none';
}

async function handleAddUser() {
    const data = {
        email: document.getElementById('userEmail').value,
        fullName: document.getElementById('userFullName').value,
        role: document.getElementById('userRole').value
    };
    
    if (data.role === 'pharmacy_staff' && document.getElementById('userPharmacyId').value) {
        data.pharmacyId = parseInt(document.getElementById('userPharmacyId').value);
    }
    if (data.role === 'facility_manager' && document.getElementById('userFacilityId').value) {
        data.facilityId = parseInt(document.getElementById('userFacilityId').value);
    }
    
    try {
        const res = await fetch(`${API_URL}/users`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + localStorage.getItem('token')
            },
            body: JSON.stringify(data)
        });
        
        if (res.ok) {
            document.getElementById('addUserModal').classList.remove('active');
            showAlert('contentAlert', 'User added!', 'success');
            loadUsers();
        }
    } catch (e) {
        showAlert('contentAlert', 'Error: ' + e.message, 'error');
    }
}

async function loadUsers() {
    try {
        const res = await fetch(`${API_URL}/users`, {
            headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
        });
        const data = await res.json();
        const users = data.users || [];

        if (!users.length) {
            document.getElementById('usersList').innerHTML = '<p style="padding: 20px; text-align: center; color: #666;">No users found</p>';
            return;
        }

        let html = '<div style="overflow-x: auto;"><table style="width: 100%; border-collapse: collapse;">';
        html += '<thead><tr style="background: #667eea; color: white;">';
        html += '<th style="padding: 12px; text-align: left; font-weight: 600;">Email</th>';
        html += '<th style="padding: 12px; text-align: left; font-weight: 600;">Name</th>';
        html += '<th style="padding: 12px; text-align: left; font-weight: 600;">Role</th>';
        html += '<th style="padding: 12px; text-align: left; font-weight: 600;">Pharmacy ID</th>';
        html += '<th style="padding: 12px; text-align: left; font-weight: 600;">Facility ID</th>';
        html += '<th style="padding: 12px; text-align: left; font-weight: 600;">Active</th>';
        html += '<th style="padding: 12px; text-align: center; font-weight: 600;">Actions</th></tr></thead>';

        html += '<tbody>';
        users.forEach((user, idx) => {
            const bgColor = idx % 2 === 0 ? '#ffffff' : '#f8f9fa';
            html += `<tr style="background: ${bgColor}; border-bottom: 1px solid #e0e0e0;">`;
            html += `<td style="padding: 12px;">${user.email || '-'}</td>`;
            html += `<td style="padding: 12px;">${user.full_name || '-'}</td>`;
            html += `<td style="padding: 12px;"><span style="background: #667eea; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px;">${user.role || '-'}</span></td>`;
            html += `<td style="padding: 12px;">${user.pharmacy_id || '-'}</td>`;
            html += `<td style="padding: 12px;">${user.facility_id || '-'}</td>`;
            html += `<td style="padding: 12px;"><span style="color: ${user.is_active ? '#27ae60' : '#e74c3c'};">${user.is_active ? '✓ Yes' : '✗ No'}</span></td>`;
            html += `<td style="padding: 12px; text-align: center;">
                <button class="btn-view" onclick="viewUser('${user.id}')">View</button>
                <button class="btn-delete" onclick="deleteUser('${user.id}')">Delete</button>
            </td></tr>`;
        });
        html += '</tbody></table></div>';
        
        document.getElementById('usersList').innerHTML = html;
    } catch (e) {
        document.getElementById('usersList').innerHTML = '<p style="padding: 20px; color: red;">Error: ' + e.message + '</p>';
    }
}

async function viewUser(userId) {
    try {
        const res = await fetch(`${API_URL}/users/${userId}`, {
            headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
        });
        const data = await res.json();
        const user = data.user || data;

        let html = '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">';
        html += `<div><strong>Email:</strong> ${user.email || '-'}</div>`;
        html += `<div><strong>Full Name:</strong> ${user.full_name || '-'}</div>`;
        html += `<div><strong>Role:</strong> <span style="background: #667eea; color: white; padding: 2px 6px; border-radius: 3px; font-size: 12px;">${user.role || '-'}</span></div>`;
        html += `<div><strong>Status:</strong> ${user.is_active ? '<span style="color: #27ae60;">✓ Active</span>' : '<span style="color: #e74c3c;">✗ Inactive</span>'}</div>`;
        html += `<div><strong>Pharmacy ID:</strong> ${user.pharmacy_id || '-'}</div>`;
        html += `<div><strong>Facility ID:</strong> ${user.facility_id || '-'}</div>`;
        html += `<div><strong>Created:</strong> ${user.createdAt ? new Date(user.createdAt).toLocaleString() : '-'}</div>`;
        html += `<div><strong>Last Login:</strong> ${user.last_login ? new Date(user.last_login).toLocaleString() : 'Never'}</div>`;
        html += '</div>';
        
        let modal = document.getElementById('userDetailModal');
        if (!modal) {
            modal = document.createElement('div');
            modal.id = 'userDetailModal';
            modal.className = 'modal';
            document.body.appendChild(modal);
        }
        
        modal.innerHTML = `
            <div class="modal-content">
                <div class="modal-header"><h2>User Details</h2><button class="modal-close" onclick="document.getElementById('userDetailModal').classList.remove('active')">×</button></div>
                <div class="modal-body">${html}</div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="document.getElementById('userDetailModal').classList.remove('active')">Close</button>
                </div>
            </div>
        `;
        modal.classList.add('active');
    } catch (e) {
        showAlert('contentAlert', 'Error: ' + e.message, 'error');
    }
}

async function deleteUser(userId) {
    if (!confirm('Delete this user?')) return;
    try {
        const res = await fetch(`${API_URL}/users/${userId}`, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
        });
        if (res.ok) {
            showAlert('contentAlert', 'User deleted!', 'success');
            loadUsers();
        }
    } catch (e) {
        showAlert('contentAlert', 'Error: ' + e.message, 'error');
    }
}

async function loadFieldManager() {
    document.getElementById('fieldsList').innerHTML = '<p>Manage client form fields here</p>';
}

function openAddFieldModal() {
    document.getElementById('addFieldModal').classList.add('active');
}

function closeAddFieldModal() {
    document.getElementById('addFieldModal').classList.remove('active');
}

async function handleAddField(e) {
    e.preventDefault();
    closeAddFieldModal();
    showAlert('contentAlert', 'Field added!', 'success');
}

function showAlert(el, msg, type) {
    const elem = document.getElementById(el);
    elem.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
    setTimeout(() => elem.innerHTML = '', 5000);
}
</script>
</body>
</html>
